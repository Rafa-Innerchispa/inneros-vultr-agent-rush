name: CI
on:
  push:
  pull_request:
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Verify API, lifecycle, privacy, contracts, and mocked runner
        run: python -m pytest -v tests/test_workflows.py tests/test_runner.py tests/test_worker.py tests/test_publisher.py tests/test_judge_ui.py tests/test_containment.py tests/test_local_advisory.py tests/test_deploy_script.py tests/test_verified_ops.py tests/test_live_bridge.py

  live-bridge-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Verify Live Bridge contracts, negative auth, revoked tokens, and privacy
        run: python -m pytest -v tests/test_live_bridge.py

  isolated-execution:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Prepare disposable sandbox image
        run: docker pull python:3.12-alpine
      - name: Test real sandbox execution, containment and cleanup
        env:
          RUN_SANDBOX_INTEGRATION: '1'
        run: python -m pytest -q tests/integration/test_docker_live.py

  judge-browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install runtime and browser QA dependencies
        run: |
          pip install -r requirements-dev.txt playwright
          python -m playwright install --with-deps chromium
      - name: Exercise real judge and ticket UI in Chromium
        run: python scripts/judge_browser_qa.py --screenshots .judge-qa
      - name: Archive judge screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: judge-qa-screenshots
          path: .judge-qa/
          if-no-files-found: ignore
